        start_time:
          type: string
        end_time:
          type: string
        min_required:
          type: integer
        status:
          type: string
          enum: [scheduled, confirmed_enough, confirmed_shortage, cancelled]
        poll_message_id:
          type: integer
        poll_id:
          type: string
        need_recruit:
          type: boolean
        recruit_count_needed:
          type: integer
        poll_sent_at:
          type: string
          format: date-time
        confirmation_sent_at:
          type: string
          format: date-time
        cost_reminder_sent_at:
          type: string
          format: date-time

    Attendance:
      type: object
      properties:
        _id:
          type: string
        session_id:
          type: string
        member_id:
          type: string
        answer:
          type: string
          enum: [present, absent, no_response]
        answered_at:
          type: string
          format: date-time

    ItemConfig:
      type: object
      properties:
        _id:
          type: string
